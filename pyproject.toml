[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evcc-sift-mutator"
version = "0.1.0"
description = "Search-based protocol mutation, self-healing fuzzing harness, and procedural decision graph for ISO 15118 / DIN SPEC 70121 EV fast charging security testing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Oleksandr Tarasov", email = "tarasov.oleksander@gmail.com" }
]
keywords = [
    "ev-charging",
    "iso15118",
    "din70121",
    "v2g",
    "fuzzing",
    "sbst",
    "stellar",
    "sift",
    "multi-armed-bandit",
    "penetration-testing",
    "enbw",
    "cybersecurity"
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[tool.setuptools]
packages = ["protocols", "simulator", "mutation", "procedural_graph", "oracles", "connection"]
py-modules = ["run_fuzzer"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
hardware = [
    # Real charger transport backend (vendored `connection/` stack). These
    # match the upstream evcc_simulator's requirements; several may be
    # unavailable in fully offline environments, in which case the harness
    # degrades gracefully (see connection.capability_summary()).
    "python-can>=4.3",   # CAN CP/PP control + J1939 telemetry (ixxat / socketcan)
    "scapy>=2.5",        # raw Ethernet frames for SLAC
    "pyslac>=0.8.3",     # HomePlug Green PHY SLAC message codecs
    "iso15118",          # spec-compliant EXI codec (pulls py4j; needs a Java runtime)
    "marshmallow>=3.13,<4",
]

[project.scripts]
evcc-fuzzer = "run_fuzzer:main"

[tool.pytest.ini_options]
# The test modules import the top-level packages directly (e.g.
# `from mutation.bandit import ...`). Put the repo root on sys.path so the
# documented `uv run pytest` works without an editable install of the project.
pythonpath = ["."]
testpaths = ["tests"]
